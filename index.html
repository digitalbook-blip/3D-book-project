<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>3D Thesis Book - Interactive Direct Reader</title>
    <!-- Preconnect and DNS Prefetch for faster link loading -->
    <link rel="preconnect" href="https://digitalbook-blip.github.io">
    <link rel="dns-prefetch" href="https://digitalbook-blip.github.io">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #090a0f;
            color: #ffffff;
            touch-action: manipulation; 
            user-select: none;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .instructions {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 16, 21, 0.75);
            color: #e2e8f0;
            padding: 10px 22px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 500;
            pointer-events: none;
            z-index: 10;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            text-align: center;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .reader-ui-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 5;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            pointer-events: none;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: rgba(12, 14, 20, 0.6);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            pointer-events: auto;
        }

        .modal-title {
            font-size: 15px;
            font-weight: 600;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: 0.5px;
        }

        .modal-title::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #6366f1;
            border-radius: 50%;
            box-shadow: 0 0 12px #6366f1;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            text-align: center;
            z-index: 20;
            text-shadow: 0 2px 8px rgba(0,0,0,0.8);
            background: rgba(15, 16, 21, 0.8);
            padding: 14px 28px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            pointer-events: none;
        }

        .controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(15, 16, 21, 0.9);
            padding: 8px 18px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(16px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            z-index: 100;
            max-width: 95vw;
            flex-wrap: wrap;
            justify-content: center;
            pointer-events: auto;
        }

        .btn {
            background: rgba(255, 255, 255, 0.08);
            color: #f1f5f9;
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 6px 14px;
            border-radius: 18px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s ease;
            white-space: nowrap;
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover { 
            background: #6366f1; 
            color: #ffffff;
            border-color: #6366f1;
        }

        .divider {
            width: 1px;
            height: 18px;
            background: rgba(255, 255, 255, 0.18);
            margin: 0 4px;
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div class="instructions">Drag to rotate view • Click book or button to open reader</div>
    <div id="canvas-container"></div>
    <div id="loading">Loading 3D Environment...</div>

    <div class="reader-ui-layer">
        <div class="top-bar">
            <span class="modal-title">The Contemporary World - 3D Showcase</span>
            <button class="btn" id="fullscreen-btn">⛶ Fullscreen</button>
        </div>

        <div class="controls" id="controls">
            <button class="btn" id="rotate-toggle">Auto Rotate: ON</button>
            <div class="divider"></div>
            <a href="https://digitalbook-blip.github.io/Book-Inside/" target="_blank" rel="noopener" class="btn" style="background: #6366f1; border-color: #6366f1;">📖 Read the Book</a>
            <div class="divider"></div>
            <button class="btn" id="reset-view">Reset Camera</button>
        </div>
    </div>

    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050508);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        function updateCameraPosition() {
            if (window.innerWidth < 600) {
                camera.position.set(0, 1.0, 7.5);
            } else {
                camera.position.set(0, 1.2, 5.5);
            }
        }
        updateCameraPosition();

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; 
        controls.dampingFactor = 0.05;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 1.0;

        scene.add(new THREE.AmbientLight(0xffffff, 0.75));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.3);
        dirLight.position.set(4, 8, 5); 
        dirLight.castShadow = true;
        scene.add(dirLight);

        // Starfield background
        const starsCount = 1000;
        const starsGeometry = new THREE.BufferGeometry();
        const starPositions = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount * 3; i += 3) {
            starPositions[i] = (Math.random() - 0.5) * 120;
            starPositions[i + 1] = (Math.random() - 0.5) * 120;
            starPositions[i + 2] = (Math.random() - 0.5) * 120;
        }
        starsGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        const starField = new THREE.Points(starsGeometry, new THREE.PointsMaterial({ color: 0xffffff, size: 0.15, transparent: true, opacity: 0.8 }));
        scene.add(starField);

        function createPaperTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#f2efe9'; ctx.fillRect(0, 0, 256, 256);
            ctx.fillStyle = '#d4ceb8';
            for (let i = 0; i < 256; i += 3) { ctx.fillRect(0, i, 256, 1); }
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping; texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(1, 4);
            return texture;
        }

        function createCoverWithCrease(imagePath, isBackCover = false) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const texture = new THREE.CanvasTexture(canvas);
            const img = new Image(); 
            img.crossOrigin = "Anonymous"; 
            img.src = imagePath;
            
            img.onload = () => {
                canvas.width = img.width || 1024; 
                canvas.height = img.height || 1400;
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                const creaseX = isBackCover ? canvas.width * 0.92 : canvas.width * 0.08; 
                const grooveWidth = canvas.width * 0.035;
                const darkGradient = ctx.createLinearGradient(creaseX - grooveWidth, 0, creaseX + grooveWidth, 0);
                darkGradient.addColorStop(0, 'rgba(0, 0, 0, 0)');
                darkGradient.addColorStop(0.5, 'rgba(0, 0, 0, 0.5)');
                darkGradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.fillStyle = darkGradient;
                ctx.fillRect(creaseX - grooveWidth, 0, grooveWidth * 2, canvas.height);
                texture.needsUpdate = true;
                
                // Hide loading message once images are successfully loaded
                const loaderEl = document.getElementById('loading');
                if (loaderEl) loaderEl.style.display = 'none';
            };

            img.onerror = () => {
                console.error("Failed to load image: " + imagePath);
                const loaderEl = document.getElementById('loading');
                if (loaderEl) loaderEl.innerText = "Error loading cover images!";
            };

            return texture;
        }

        const textureLoader = new THREE.TextureLoader();
        const frontCover = createCoverWithCrease('front-cover.jpg', false);
        const backCover = createCoverWithCrease('back-cover.jpg', true);
        const spineCover = textureLoader.load('spine-cover.jpg');
        const paperMaterial = new THREE.MeshStandardMaterial({ map: createPaperTexture(), roughness: 0.8 });

        const materials = [
            paperMaterial,
            new THREE.MeshStandardMaterial({ map: spineCover, roughness: 0.4 }),
            paperMaterial, paperMaterial,
            new THREE.MeshStandardMaterial({ map: frontCover, roughness: 0.3 }),
            new THREE.MeshStandardMaterial({ map: backCover, roughness: 0.3 })
        ];

        const bookGroup = new THREE.Group();
        const book = new THREE.Mesh(new THREE.BoxGeometry(2, 2.8, 0.28), materials);
        book.castShadow = true;
        bookGroup.add(book);
        bookGroup.rotation.y = Math.PI / 4;
        scene.add(bookGroup);

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('click', (event) => {
            if (event.target.closest('.controls') || event.target.closest('.top-bar')) return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(book);

            if (intersects.length > 0) {
                window.open('https://digitalbook-blip.github.io/Book-Inside/', '_blank', 'noopener');
            }
        });

        const rotateToggleBtn = document.getElementById('rotate-toggle');
        rotateToggleBtn.addEventListener('click', () => {
            controls.autoRotate = !controls.autoRotate;
            rotateToggleBtn.innerText = `Auto Rotate: ${controls.autoRotate ? 'ON' : 'OFF'}`;
        });

        document.getElementById('reset-view').addEventListener('click', () => {
            controls.reset();
            bookGroup.rotation.set(0, Math.PI / 4, 0);
        });

        document.getElementById('fullscreen-btn').addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => console.log(err));
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            updateCameraPosition();
        });

        function animate() {
            requestAnimationFrame(animate);
            if (typeof starField !== 'undefined') {
                starField.rotation.y += 0.0003;
                starField.rotation.x += 0.0001;
            }
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
